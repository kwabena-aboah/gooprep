services:
  - type: web
    name: gooprep-api
    env: python
    region: frankfurt
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gooprep-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: gooprep-redis
          type: redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: gooprep-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://gooprep.onrender.com,https://gooprep.com
  - type: worker
    name: gooprep-celery
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DATABASE_URL
        fromDatabase:
          name: gooprep-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: gooprep-redis
          type: redis
          property: connectionString
  - type: redis
    name: gooprep-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
databases:
  - name: gooprep-db
    databaseName: gooprep
    user: gooprep
    plan: starter
